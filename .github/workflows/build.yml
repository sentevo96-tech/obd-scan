name: Build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile check (simulator, no signing)
        run: |
          xcodebuild build \
            -project OBDScanner.xcodeproj \
            -scheme OBDScanner \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned .ipa for Sideloadly/AltStore
        run: |
          xcodebuild build \
            -project OBDScanner.xcodeproj \
            -scheme OBDScanner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/OBDScanner.app Payload/
          zip -r OBDScanner.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: OBDScanner-ipa
          path: OBDScanner.ipa
