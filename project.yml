name: OBDScanner
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  OBDScanner:
    type: application
    platform: iOS
    sources:
      - OBDScanner
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: OBD2 Сканер
        NSBluetoothAlwaysUsageDescription: Для связи с OBD2-адаптером
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.obdscanner
        TARGETED_DEVICE_FAMILY: "1"
